[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-review-project"
version = "1.0.0"
description = "Steam 简体中文评测采集、清洗、存储与统计（数据采集课程作业）"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "rjieba==0.2.2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steam_reviews = ["storage/schema.sql"]

